# setw -g window-status-bell-style 'fg=black bg=yellow bold'

# -------
# Plugins
# -------

# status bar (dotbar) theme
set -g @tmux-dotbar-position "top"
set -g @tmux-dotbar-bg "#222222"
set -g @tmux-dotbar-fg "grey"
set -g @tmux-dotbar-fg-current "yellow"
set -g @tmux-dotbar-fg-session "white"
set -g @tmux-dotbar-fg-prefix "yellow"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'vaaleyard/tmux-dotbar'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

